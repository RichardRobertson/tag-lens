[package]
name = "tag-lens-rs"
version = "0.1.0"
edition = "2024"
description = "WASM side of Tag lens"
repository = "https://github.com/RichardRobertson/tag-lens-rs"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
console_error_panic_hook = { version = "0.1.7", optional = true }
gloo-timers = { version = "0.4.1", features = ["futures"] }
regex-cursor = { version = "0.1.5", features = ["ropey"] }
regex-syntax = "0.8.11"
ropey = "1.6.1"
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
thiserror = "2.0.21"
tsify = { version = "0.5.8", default-features = false, features = [
    "wasm-bindgen",
    "js",
] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.80"

[profile.release]
opt-level = "s"

[dev-dependencies]
futures = "0.3.34"
rand = "0.10.3"
